name: Verify and deploy

on:
  pull_request:
  merge_group:
  push:
    branches: ["**"]

permissions:
  contents: read
  deployments: write

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      scrypto: ${{ steps.filter.outputs.scrypto }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect frontend and Scrypto changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - '**'
              - '!scrypto/**'
            scrypto:
              - 'scrypto/**'

  verify-frontend:
    name: Run frontend and Worker tests
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm check-types
      - run: pnpm test:unit
      - run: pnpm test:worker

  verify-scrypto:
    name: Verify Scrypto
    needs: changes
    if: needs.changes.outputs.scrypto == 'true'
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.25.0
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm test:scrypto

  deploy-production:
    name: Deploy production Worker
    needs: [changes, verify-frontend, verify-scrypto]
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.frontend == 'true' &&
      (needs.verify-frontend.result == 'success') &&
      (needs.verify-scrypto.result == 'success' || needs.verify-scrypto.result == 'skipped')
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm deploy:production

  deploy-staging:
    name: Deploy staging Worker
    needs: [changes, verify-frontend, verify-scrypto]
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/staging' &&
      needs.changes.outputs.frontend == 'true' &&
      (needs.verify-frontend.result == 'success') &&
      (needs.verify-scrypto.result == 'success' || needs.verify-scrypto.result == 'skipped')
    runs-on: ubuntu-latest
    environment: preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm deploy:preview

  deploy-preview:
    name: Deploy PR preview Worker
    needs: [changes, verify-frontend, verify-scrypto]
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.changes.outputs.frontend == 'true' &&
      (needs.verify-frontend.result == 'success') &&
      (needs.verify-scrypto.result == 'success' || needs.verify-scrypto.result == 'skipped')
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PREVIEW_ALIAS: pr-${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create preview deployment
        id: deployment
        uses: actions/github-script@v7
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.payload.pull_request.head.sha,
              environment: `preview/pr-${context.payload.pull_request.number}`,
              description: `Deploying Cloudflare Worker preview for PR #${context.payload.pull_request.number}`,
              auto_merge: false,
              required_contexts: [],
              transient_environment: true,
              production_environment: false,
            })
            core.setOutput("id", deployment.data.id)
      - id: upload
        run: pnpm deploy:preview-version
      - name: Publish preview URL
        uses: actions/github-script@v7
        env:
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.id }}
          PREVIEW_URL: ${{ steps.upload.outputs.preview-url }}
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: Number(process.env.DEPLOYMENT_ID),
              state: "success",
              environment_url: process.env.PREVIEW_URL,
              description: "Cloudflare Worker preview is ready",
              auto_inactive: true,
            })
      - name: Mark preview deployment as failed
        if: failure() && steps.deployment.outputs.id
        uses: actions/github-script@v7
        env:
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.id }}
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: Number(process.env.DEPLOYMENT_ID),
              state: "failure",
              description: "Cloudflare Worker preview deployment failed",
            })
