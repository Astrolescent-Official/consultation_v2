name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        # Pinned (not the floating @v1 tag): v1.0.184-186 each bundle a newer
        # Claude Code CLI (2.1.221-223) that breaks this plugin's parallel
        # multi-agent review flow in this action's non-interactive `claude -p`
        # mode -- 2.1.222 (v1.0.185) silently drops every comment with
        # permission_denials_count > 0, and 2.1.223 (v1.0.186) has the review
        # agent launch subagents in background mode and then exit without
        # ever collecting their results (no notification loop exists outside
        # an interactive session). v1.0.183 bundles 2.1.220, the last version
        # confirmed working end-to-end (PR #30's canary got a real inline
        # comment). Re-verify with a canary PR before bumping this pin.
        uses: anthropics/claude-code-action@v1.0.183
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: |
            /code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}
          settings: |
            {
              "permissions": {
                "allow": [
                  "Skill",
                  "Task",
                  "Read",
                  "Glob",
                  "Grep",
                  "Bash(gh:*)",
                  "Bash(git diff:*)",
                  "Bash(git log:*)",
                  "Bash(git show:*)",
                  "Bash(git blame:*)"
                ]
              }
            }
          additional_permissions: |
            actions: read
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
