packages:
  - packages/*
  - apps/*

approveBuildsAutomatically: true

catalog:
  '@biomejs/biome': 2.3.8
  '@cloudflare/vitest-pool-workers': 0.12.21
  '@effect/experimental': 0.57.9
  '@effect-atom/atom-react': ^0.4.4
  '@effect/language-service': ^0.62.0
  '@effect/platform': ^0.93.6
  '@effect/rpc': ^0.72.2
  '@effect/sql': ^0.48.6
  '@effect/sql-d1': ^0.46.0
  '@effect/sql-drizzle': ^0.47.0
  '@effect/vitest': ^0.27.0
  '@radix-effects/gateway': ^0.5.0
  '@radix-effects/shared': ^0.0.1
  '@radixdlt/babylon-gateway-api-sdk': ^1.10.1
  '@types/node': ^25.0.0
  bignumber.js: ^9.3.1
  decimal.js: ^10.5.0
  drizzle-orm: 0.45.1
  effect: 3.19.11
  sbor-ez-mode: ^0.2.0
  tsx: ^4.21.0
  typescript: ^5.7.2
  vite: ^7.1.7
  vitest: 3.2.4

ignoredBuiltDependencies:
  - '@parcel/watcher'
  - cpu-features
  - esbuild
  - msgpackr-extract
  - msw
  - protobufjs
  - secp256k1
  - sharp
  - ssh2
  - workerd

peerDependencyRules:
  allowedVersions:
    # Wrangler only uses this optional peer for editor types. The application
    # uses `wrangler types`; pinning v4 keeps Drizzle and Effect SQL on one
    # nominal type identity until their Vitest 3-compatible releases accept v5.
    '@cloudflare/workers-types': '>=4.20260702.1'
